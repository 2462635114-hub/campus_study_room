{% extends "base.html" %}

{% block title %}500 · 服务器异常 · 校园自习室预约系统{% endblock %}

{% block content %}
<div class="container">
  <div class="error-page">
    <p class="error-page__code" aria-hidden="true">500</p>
    <h1 class="error-page__title">服务器暂时不可用</h1>
    <p class="error-page__text">服务器在处理请求时遇到了问题，请稍后重试。为安全起见，页面不会显示具体的异常信息；如果问题持续出现，请联系系统管理员。</p>
    <div class="error-page__actions">
      <a class="btn btn--primary" href="{{ url_for('student.home') }}">返回首页</a>
      <button class="btn btn--secondary" type="button" onclick="history.back()">返回上一页</button>
    </div>
  </div>
</div>
{% endblock %}
