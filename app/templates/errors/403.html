{% extends "base.html" %}

{% block title %}403 · 没有访问权限 · 校园自习室预约系统{% endblock %}

{% block content %}
<div class="container">
  <div class="error-page">
    <p class="error-page__code" aria-hidden="true">403</p>
    <h1 class="error-page__title">没有访问权限</h1>
    <p class="error-page__text">你的账号无权访问该页面或执行该操作。如果你是学生账号，请返回首页浏览自习室，或查看自己的预约记录。</p>
    <div class="error-page__actions">
      <a class="btn btn--primary" href="{{ url_for('student.home') }}">返回首页</a>
      {% if current_user.is_authenticated %}
      <a class="btn btn--secondary" href="{{ url_for('student.my_reservations') }}">我的预约</a>
      {% else %}
      <a class="btn btn--secondary" href="{{ url_for('auth.login') }}">去登录</a>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
